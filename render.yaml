services:
  - type: web
    name: smart-web-health-monitoring-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: LIGHTHOUSE_TIMEOUT_MS
        value: "180000"
      - key: CHROME_PATH
        value: /usr/bin/chromium
      - key: CHROME_FLAGS
        value: "--headless=new,--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--ignore-certificate-errors,--no-first-run,--no-zygote"

